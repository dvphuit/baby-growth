name: Refactor growth persistence PR gate

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/refactor-growth-persistence-pr.yml
      - app/scripts/refactor-growth-persistence.mjs

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/feature-first-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply and verify raw growth persistence
        run: |
          set -e
          cd app
          npm ci
          node scripts/refactor-growth-persistence.mjs
          npm test
          npm run lint
          npm run build
      - name: Commit verified growth persistence
        run: |
          rm -f .github/workflows/refactor-growth-persistence-pr.yml app/scripts/refactor-growth-persistence.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src ARCHITECTURE.md .github/workflows/refactor-growth-persistence-pr.yml app/scripts/refactor-growth-persistence.mjs
          git diff --cached --check
          unexpected="$(git diff --cached --name-only | grep -Ev '^(app/src/|ARCHITECTURE\.md$|app/scripts/refactor-growth-persistence\.mjs$|\.github/workflows/refactor-growth-persistence-pr\.yml$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected staged paths:"
            echo "$unexpected"
            exit 1
          fi
          git commit -m "refactor: persist raw growth facts"
          git push origin HEAD:refactor/feature-first-architecture
