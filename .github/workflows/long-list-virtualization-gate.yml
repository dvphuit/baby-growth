name: Long list virtualization gate

on:
  push:
    branches:
      - perf/long-list-virtualization

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply deterministic migration
        run: node scripts/apply-long-list-virtualization.mjs
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Test
        working-directory: app
        run: npm test
      - name: Lint
        working-directory: app
        run: npm run lint
      - name: Build
        working-directory: app
        run: npm run build
      - name: Commit verified production changes
        run: |
          set -e
          rm scripts/apply-long-list-virtualization.mjs
          rm .github/workflows/long-list-virtualization-gate.yml
          git add -A -- \
            .github/workflows/long-list-virtualization-gate.yml \
            scripts/apply-long-list-virtualization.mjs \
            app/src/shared/hooks/useProgressiveList.ts \
            app/src/shared/hooks/useProgressiveList.test.tsx \
            app/src/shared/ui/ProgressiveListBoundary.tsx \
            app/src/features/timeline/TimelineView.tsx \
            app/src/features/expenses/ExpensesView.tsx \
            app/src/features/growth/GrowthHistory.tsx \
            app/src/shared/styles/shared.css \
            app/src/features/expenses/expenses.css \
            app/src/features/growth/growth-view.css \
            app/src/architecture/performanceAudit.test.mjs
          git diff --cached --check
          printf '%s\n' \
            .github/workflows/long-list-virtualization-gate.yml \
            scripts/apply-long-list-virtualization.mjs \
            app/src/architecture/performanceAudit.test.mjs \
            app/src/features/expenses/ExpensesView.tsx \
            app/src/features/expenses/expenses.css \
            app/src/features/growth/GrowthHistory.tsx \
            app/src/features/growth/growth-view.css \
            app/src/features/timeline/TimelineView.tsx \
            app/src/shared/hooks/useProgressiveList.test.tsx \
            app/src/shared/hooks/useProgressiveList.ts \
            app/src/shared/styles/shared.css \
            app/src/shared/ui/ProgressiveListBoundary.tsx | sort > /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "perf: progressively render long lists"
          git push origin HEAD:perf/long-list-virtualization
