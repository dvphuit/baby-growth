name: Ownership Migration Gate

on:
  push:
    branches:
      - refactor/feature-ownership-cleanup

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/feature-ownership-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Run ownership migration
        working-directory: app
        run: node scripts/migrate-feature-ownership.mjs
      - name: Test
        working-directory: app
        run: npm test
      - name: Lint
        working-directory: app
        run: npm run lint
      - name: Build
        working-directory: app
        run: npm run build
      - name: Verify residue and staged diff
        run: |
          test ! -e app/src/data/expenseCategories.ts
          test ! -e app/src/utils/expenseMath.ts
          test ! -e app/src/shared/ui/HavenMedicationPicker.tsx
          test ! -e app/src/shared/ui/HavenMilkAmountInput.tsx
          test ! -e app/src/shared/ui/HavenTemperatureInput.tsx
          test ! -e app/src/shared/ui/Header.tsx
          git diff --check
      - name: Publish verified migration
        run: |
          rm .github/workflows/ownership-migration.yml
          rm app/scripts/migrate-feature-ownership.mjs
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Migration produced no changes"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refactor feature-owned modules"
          git push origin HEAD:refactor/feature-ownership-cleanup
