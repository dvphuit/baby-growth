name: Optimize Home assets

on:
  push:
    branches:
      - perf/pwa-asset-delivery

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/pwa-asset-delivery
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Generate optimized assets
        run: node scripts/optimize-home-assets.mjs

      - name: Test
        working-directory: app
        run: npm test

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Build
        working-directory: app
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_REF: perf/pwa-asset-delivery
          VITE_BUILD_TIME: ${{ github.run_started_at }}

      - name: Commit verified asset delivery changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check

          unexpected="$(git diff --cached --name-only | grep -Ev '^(app/assets-source/(decor/care-(milk|sleep|diaper|clock)\.png|icons/(app-icon-plant-v1|app-icon-source)\.png)|app/public/(app-icon-plant-v1|app-icon-source)\.png|app/public/assets/decor/care-(milk|sleep|diaper|clock)\.(png|webp)|app/src/features/home/components/BabyHomeView\.tsx|app/src/sw\.ts|app/vite\.config\.ts|app/src/architecture/performanceAudit\.test\.mjs|\.github/workflows/optimize-home-assets\.yml|scripts/optimize-home-assets\.mjs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected staged files:"
            echo "$unexpected"
            exit 1
          fi

          git commit -m "perf: optimize PWA asset delivery"
          git push origin HEAD:perf/pwa-asset-delivery
