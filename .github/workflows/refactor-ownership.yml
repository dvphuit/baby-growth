name: Refactor source ownership

on:
  push:
    branches:
      - refactor/feature-first-architecture
    paths:
      - .github/workflows/refactor-ownership.yml
      - app/scripts/refactor-source-ownership.mjs

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/feature-first-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply and validate ownership migration
        id: migrate
        run: |
          set +e
          (
            cd app
            node scripts/refactor-source-ownership.mjs
            npm ci
            npm test
            npm run lint
            npm run build
          ) 2>&1 | tee /tmp/refactor-ownership.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Report migration failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Ownership codemod failed for \`$GITHUB_SHA\`."
            echo
            echo "<details><summary>Failure log tail</summary>"
            echo
            echo '```text'
            tail -n 120 /tmp/refactor-ownership.log || true
            echo '```'
            echo "</details>"
          } > /tmp/refactor-ownership-comment.md
          gh pr comment 16 --repo "$GITHUB_REPOSITORY" --body-file /tmp/refactor-ownership-comment.md
      - name: Commit ownership migration
        if: success()
        run: |
          rm .github/workflows/refactor-ownership.yml app/scripts/refactor-source-ownership.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src .github/workflows/refactor-ownership.yml app/scripts/refactor-source-ownership.mjs
          git diff --cached --check
          unexpected="$(git diff --cached --name-only | grep -Ev '^(app/src/|app/scripts/refactor-source-ownership\.mjs$|\.github/workflows/refactor-ownership\.yml$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected staged paths:"
            echo "$unexpected"
            exit 1
          fi
          git commit -m "refactor: move shared and feature-owned UI"
          git push origin HEAD:refactor/feature-first-architecture
