name: App shell verification

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/app-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: |
          cd app
          npm install --save-dev vitest @testing-library/react @testing-library/jest-dom @testing-library/user-event jsdom
          npm pkg set scripts.test="vitest run"
      - name: Persist package metadata
        run: |
          if ! git diff --quiet -- app/package.json app/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/package.json app/package-lock.json
            git commit -m "test: add app shell test dependencies"
            git push origin HEAD:refactor/app-shell
          fi
      - name: Test
        run: cd app && npm test
      - name: Lint
        run: cd app && npm run lint
      - name: Build
        run: cd app && npm run build
