name: Refactor state inventory

on:
  push:
    branches:
      - refactor/feature-first-architecture
    paths:
      - .github/workflows/refactor-state-inventory.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/feature-first-architecture
      - name: Inventory mixed-state callers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'State ownership inventory:'
            echo
            echo '<details><summary>useBabyStore / legacy baby key</summary>'
            echo
            echo '```text'
            grep -RInE --include='*.ts' --include='*.tsx' --include='*.mjs' 'useBabyStore|babygrowth_v4_baby' app/src || true
            echo '```'
            echo '</details>'
            echo
            echo '<details><summary>familyData / growth state references</summary>'
            echo
            echo '```text'
            grep -RInE --include='*.ts' --include='*.tsx' 'familyData|currentStage|dailyHabits|growthHistory|initializeChildProfile' app/src || true
            echo '```'
            echo '</details>'
          } > /tmp/state-inventory.md
          gh pr comment 16 --repo "$GITHUB_REPOSITORY" --body-file /tmp/state-inventory.md
