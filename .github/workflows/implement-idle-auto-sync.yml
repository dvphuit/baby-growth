name: Implement idle auto-sync

on:
  push:
    branches:
      - perf/idle-auto-sync
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/idle-auto-sync
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Apply idle auto-sync migration
        run: node scripts/implement-idle-auto-sync.mjs

      - name: Finalize idle scheduler and tests
        run: node scripts/finalize-idle-auto-sync.mjs

      - name: Typecheck
        working-directory: app
        run: npx tsc -b --pretty false

      - name: Run targeted idle auto-sync tests
        working-directory: app
        run: npm test -- src/shared/lib/idleTask.test.ts src/features/sync/hooks/useAutoSyncLifecycle.test.tsx src/features/sync/autoSyncPerformance.test.mjs

      - name: Run full test suite
        working-directory: app
        run: npm test

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Build
        working-directory: app
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_REF: perf/idle-auto-sync
          VITE_BUILD_TIME: ${{ github.run_started_at }}

      - name: Commit verified idle auto-sync changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git restore -- app/src/app/App.tsx
          test -z "$(git status --short -- app/src/app/App.tsx)"

          git add -A
          git diff --cached --check

          unexpected="$(git diff --cached --name-only | grep -Ev '^(app/src/shared/lib/idleTask(\.test)?\.ts|app/src/features/sync/hooks/useAutoSyncLifecycle(\.ts|\.test\.tsx)|app/src/features/sync/googleDriveSync\.ts|app/src/features/sync/autoSyncPerformance\.test\.mjs|\.github/workflows/implement-idle-auto-sync\.yml|scripts/(implement|finalize)-idle-auto-sync\.mjs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected staged files:"
            echo "$unexpected"
            exit 1
          fi

          git commit -m "perf: defer auto-sync work to idle time"
          git push origin HEAD:perf/idle-auto-sync
