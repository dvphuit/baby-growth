name: Implement idle auto-sync

on:
  push:
    branches:
      - perf/idle-auto-sync
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/idle-auto-sync
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Apply idle auto-sync migration
        run: node scripts/implement-idle-auto-sync.mjs

      - name: Make idle cleanup resilient
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const helperPath = 'app/src/shared/lib/idleTask.ts';
          let helper = readFileSync(helperPath, 'utf8');
          const unsafeCancel = '      window.cancelIdleCallback(idleId);';
          const safeCancel = `      if (typeof window.cancelIdleCallback === 'function') {
                window.cancelIdleCallback(idleId);
              }`;
          if (!helper.includes(unsafeCancel)) {
            throw new Error('Expected idle cancellation fragment was not generated');
          }
          helper = helper.replace(unsafeCancel, safeCancel);
          writeFileSync(helperPath, helper);

          const testPath = 'app/src/features/sync/hooks/useAutoSyncLifecycle.test.tsx';
          let testSource = readFileSync(testPath, 'utf8');

          const remoteUpdateBefore = `    startAutoSyncMock.mockResolvedValue(vi.fn());
              renderHook(() => useAutoSyncLifecycle());
          
              window.dispatchEvent(new Event('babygrowth:remote-updated'));
              expect(reloadPageMock).toHaveBeenCalledTimes(1);`;
          const remoteUpdateAfter = `    startAutoSyncMock.mockResolvedValue(vi.fn());
              const { unmount } = renderHook(() => useAutoSyncLifecycle());
          
              window.dispatchEvent(new Event('babygrowth:remote-updated'));
              expect(reloadPageMock).toHaveBeenCalledTimes(1);
              unmount();`;

          const normalizedRemoteBefore = remoteUpdateBefore.replace(/^ {10}/gm, '');
          const normalizedRemoteAfter = remoteUpdateAfter.replace(/^ {10}/gm, '');
          if (!testSource.includes(normalizedRemoteBefore)) {
            throw new Error('Expected remote update test fragment was not generated');
          }
          testSource = testSource.replace(normalizedRemoteBefore, normalizedRemoteAfter);

          const rejectionBefore = `    startAutoSyncMock.mockRejectedValue(new Error('sync unavailable'));
              renderHook(() => useAutoSyncLifecycle());
          
              runIdleCallback();
              await waitFor(() => expect(startAutoSyncMock).toHaveBeenCalledTimes(1));`;
          const rejectionAfter = `    startAutoSyncMock.mockRejectedValue(new Error('sync unavailable'));
              const { unmount } = renderHook(() => useAutoSyncLifecycle());
          
              runIdleCallback();
              await waitFor(() => expect(startAutoSyncMock).toHaveBeenCalledTimes(1));
              unmount();`;

          const normalizedRejectionBefore = rejectionBefore.replace(/^ {10}/gm, '');
          const normalizedRejectionAfter = rejectionAfter.replace(/^ {10}/gm, '');
          if (!testSource.includes(normalizedRejectionBefore)) {
            throw new Error('Expected rejection test fragment was not generated');
          }
          testSource = testSource.replace(normalizedRejectionBefore, normalizedRejectionAfter);
          writeFileSync(testPath, testSource);
          NODE

      - name: Typecheck idle auto-sync changes
        working-directory: app
        run: npx tsc -b --pretty false

      - name: Run targeted idle auto-sync tests
        working-directory: app
        run: npm test -- src/shared/lib/idleTask.test.ts src/features/sync/hooks/useAutoSyncLifecycle.test.tsx src/features/sync/autoSyncPerformance.test.mjs

      - name: Run full test suite
        working-directory: app
        run: npm test

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Build
        working-directory: app
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_REF: perf/idle-auto-sync
          VITE_BUILD_TIME: ${{ github.run_started_at }}

      - name: Commit verified idle auto-sync changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check

          unexpected="$(git diff --cached --name-only | grep -Ev '^(app/src/shared/lib/idleTask(\.test)?\.ts|app/src/features/sync/hooks/useAutoSyncLifecycle(\.test)?\.tsx|app/src/features/sync/googleDriveSync\.ts|app/src/features/sync/autoSyncPerformance\.test\.mjs|\.github/workflows/implement-idle-auto-sync\.yml|scripts/implement-idle-auto-sync\.mjs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected staged files:"
            echo "$unexpected"
            exit 1
          fi

          git commit -m "perf: defer auto-sync work to idle time"
          git push origin HEAD:perf/idle-auto-sync
