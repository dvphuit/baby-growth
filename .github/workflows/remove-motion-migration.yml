name: Remove Motion migration gate

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'perf/remove-motion-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply deterministic native animation migration
        run: node scripts/remove-motion-runtime.mjs

      - name: Refresh lockfile
        working-directory: app
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Test
        working-directory: app
        run: npm test

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Build
        working-directory: app
        run: npm run build

      - name: Verify Motion residue is zero
        run: |
          if grep -R -E "from ['\"]motion(/react)?['\"]|import\(['\"]motion(/react)?['\"]\)" app/src --include='*.ts' --include='*.tsx'; then
            echo "Motion imports remain"
            exit 1
          fi
          if grep -R -E "\b(MotionConfig|LayoutGroup|AnimatePresence|motion\.)\b" app/src --include='*.ts' --include='*.tsx' --exclude='*.test.*' --exclude='*.spec.*'; then
            echo "Motion runtime API residue remains"
            exit 1
          fi
          test ! -d app/src/shared/motion
          node -e "const p=require('./app/package.json'); if (p.dependencies?.motion || p.devDependencies?.motion) process.exit(1)"
          git diff --check

      - name: Remove migration tooling
        run: rm .github/workflows/remove-motion-migration.yml scripts/remove-motion-runtime.mjs

      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Motion with native browser animations"
          git push origin HEAD:${{ github.head_ref }}
