name: Sync snapshot worker migration gate

on:
  push:
    branches:
      - perf/sync-snapshot-worker

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/sync-snapshot-worker

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply deterministic migration
        run: node scripts/migrate-sync-snapshot-worker.mjs

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Test
        working-directory: app
        run: npm test

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Build
        working-directory: app
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_REF: perf/sync-snapshot-worker
          VITE_BUILD_TIME: ${{ github.run_started_at }}

      - name: Commit verified production diff
        run: |
          set -e
          rm .github/workflows/sync-snapshot-worker-migration.yml
          rm scripts/migrate-sync-snapshot-worker.mjs
          git add -A
          git diff --cached --check

          unexpected="$(git diff --cached --name-only | grep -Ev '^(app/src/features/sync/(googleDriveSync\.ts|googleDriveSync\.test\.ts|autoSyncPerformance\.test\.mjs|syncSnapshotSerialization\.ts|syncSnapshotSerialization\.test\.ts|syncSnapshotWorkerProtocol\.ts|syncSnapshotWorker\.ts|syncSnapshotWorker\.test\.ts|syncSnapshot\.worker\.ts)|\.github/workflows/sync-snapshot-worker-migration\.yml|scripts/migrate-sync-snapshot-worker\.mjs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files in staged diff:"
            echo "$unexpected"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf: move sync serialization to worker"
          git push origin HEAD:perf/sync-snapshot-worker
