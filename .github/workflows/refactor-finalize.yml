name: Refactor finalizer

on:
  push:
    branches:
      - refactor/feature-first-architecture
    paths:
      - .github/workflows/refactor-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/feature-first-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Remove ghost persistence key
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'app/src/features/sync/googleDriveSync.ts';
          const source = fs.readFileSync(path, 'utf8');
          const ghostKey = "  'babygrowth_v4_mom',\n";
          if (!source.includes(ghostKey)) {
            throw new Error('Expected ghost Mom persistence key was not found.');
          }
          const next = source.replace(ghostKey, '');
          if (next.includes('babygrowth_v4_mom')) {
            throw new Error('Ghost Mom persistence key still exists after transform.');
          }
          fs.writeFileSync(path, next);
          NODE
      - name: Refresh package lock metadata
        working-directory: app
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Test
        working-directory: app
        run: npm test
      - name: Lint
        working-directory: app
        run: npm run lint
      - name: Build
        working-directory: app
        run: npm run build
      - name: Verify metadata cleanup
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lock = fs.readFileSync('app/package-lock.json', 'utf8');
          if (lock.includes('babygrowth-ai')) throw new Error('Legacy AI package identity remains in package-lock.json.');
          const sync = fs.readFileSync('app/src/features/sync/googleDriveSync.ts', 'utf8');
          if (sync.includes('babygrowth_v4_mom')) throw new Error('Ghost Mom persistence key remains.');
          NODE
      - name: Commit finalized metadata
        run: |
          rm .github/workflows/refactor-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/package-lock.json app/src/features/sync/googleDriveSync.ts .github/workflows/refactor-finalize.yml
          git diff --cached --check
          git commit -m "chore: finalize refactor metadata"
          git push origin HEAD:refactor/feature-first-architecture
