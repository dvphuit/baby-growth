name: Google Drive legacy backup hotfix

on:
  push:
    branches:
      - fix/google-drive-legacy-backup-login
    paths:
      - .github/workflows/google-drive-legacy-backup-hotfix.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/google-drive-legacy-backup-login
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply hotfix
        run: node scripts/fix-google-drive-legacy-backup.mjs
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Test
        working-directory: app
        run: npm test
      - name: Lint
        working-directory: app
        run: npm run lint
      - name: Build
        working-directory: app
        run: npm run build
      - name: Verify diff
        run: |
          git diff --check
          test -n "$(git status --short app/src/features/sync/googleDriveSync.ts app/src/features/sync/googleDriveSync.test.ts)"
      - name: Commit verified hotfix
        run: |
          rm .github/workflows/google-drive-legacy-backup-hotfix.yml
          rm scripts/fix-google-drive-legacy-backup.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/features/sync/googleDriveSync.ts app/src/features/sync/googleDriveSync.test.ts .github/workflows/google-drive-legacy-backup-hotfix.yml scripts/fix-google-drive-legacy-backup.mjs
          git diff --cached --check
          git commit -m "fix: ignore legacy Drive backups after sign-in"
          git push origin HEAD:fix/google-drive-legacy-backup-login
