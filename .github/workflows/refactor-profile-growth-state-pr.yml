name: Refactor profile and growth state PR gate

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/refactor-profile-growth-state-pr.yml
      - app/scripts/refactor-profile-growth-state-v2.mjs
      - app/scripts/cleanup-profile-growth-test-imports.mjs

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/feature-first-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply profile/growth split
        run: |
          set -e
          cd app
          npm ci
          sed -i "/replaceExact('src\/features\/timeline\/TimelineView.test.tsx', \"useBabyStore.getState().updateFamilyData/d" scripts/refactor-profile-growth-state-v2.mjs
          node scripts/refactor-profile-growth-state-v2.mjs
          node --input-type=module -e "import fs from 'node:fs'; const fixes = new Map([['src/app/onboarding/OnboardingView.tsx', [[\"'../common/HavenIcons'\", \"'@/shared/ui/HavenIcons'\"], [\"'../common/HavenDatePicker'\", \"'@/shared/ui/HavenDatePicker'\"], [\"'../common/HavenDropdown'\", \"'@/shared/ui/HavenDropdown'\"]]], ['src/features/timeline/components/CalendarStrip.tsx', [[\"'../../data/seedData'\", \"'@/data/seedData'\"]]], ['src/features/timeline/components/MultiDayBanner.tsx', [[\"'../../data/seedData'\", \"'@/data/seedData'\"]]], ['src/features/timeline/components/TimelineFeed.tsx', [[\"'../../types'\", \"'@/types'\"]]]]); for (const [file, replacements] of fixes) { let source = fs.readFileSync(file, 'utf8'); for (const [from, to] of replacements) source = source.replaceAll(from, to); fs.writeFileSync(file, source); }"
          node scripts/cleanup-profile-growth-test-imports.mjs
          ! grep -R -n -E "\.\./common/(HavenIcons|HavenDatePicker|HavenDropdown)|\.\./\.\./(data/seedData|types)" src/app/onboarding src/features/timeline/components
          npm test
          npm run lint
          npm run build
      - name: Commit verified split
        run: |
          rm -f .github/workflows/refactor-profile-growth-state-pr.yml app/scripts/refactor-profile-growth-state-v2.mjs app/scripts/cleanup-profile-growth-test-imports.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src .github/workflows/refactor-profile-growth-state-pr.yml app/scripts/refactor-profile-growth-state-v2.mjs app/scripts/cleanup-profile-growth-test-imports.mjs
          git diff --cached --check
          unexpected="$(git diff --cached --name-only | grep -Ev '^(app/src/|app/scripts/(refactor-profile-growth-state-v2|cleanup-profile-growth-test-imports)\.mjs$|\.github/workflows/refactor-profile-growth-state-pr\.yml$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected staged paths:"
            echo "$unexpected"
            exit 1
          fi
          git commit -m "refactor: split profile and growth state ownership"
          git push origin HEAD:refactor/feature-first-architecture
