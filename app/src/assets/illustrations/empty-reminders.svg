<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <style>
      .canvas-bg { fill: #FAF8F5; }
      .sage-dark { fill: #8DA06F; }
      .sage-light { fill: #E5ECD9; }
      .sage-subtle { fill: #F1F5EB; }
      .amber { fill: #F5B842; }
      .amber-light { fill: #FEF7E9; }
      .lavender { fill: #9477ED; }
      .lavender-light { fill: #F3EFFD; }
      .terracotta { fill: #E97332; }
      .brown { fill: #4A372E; }
    </style>
  </defs>

  <rect width="400" height="300" rx="24" class="canvas-bg" />
  <circle cx="200" cy="150" r="95" class="lavender-light" />
  <circle cx="150" cy="110" r="40" class="sage-subtle" />

  <!-- Calendar Page Card behind -->
  <g transform="translate(130, 80)">
    <rect x="0" y="0" width="140" height="120" rx="16" fill="#FFFFFF" stroke="#8DA06F" stroke-width="2" />
    <!-- Header bar -->
    <path d="M0,16 Q0,0 16,0 L124,0 Q140,0 140,16 L140,28 L0,28 Z" class="sage-dark" />
    <circle cx="25" cy="14" r="3.5" fill="#FAF8F5" />
    <circle cx="115" cy="14" r="3.5" fill="#FAF8F5" />

    <!-- Calendar grid dots -->
    <g transform="translate(25, 45)">
      <circle cx="0" cy="0" r="4" class="sage-light" />
      <circle cx="22" cy="0" r="4" class="sage-light" />
      <circle cx="44" cy="0" r="4" class="sage-light" />
      <circle cx="66" cy="0" r="4" class="sage-light" />
      <circle cx="88" cy="0" r="4" class="sage-light" />

      <circle cx="0" cy="18" r="4" class="sage-light" />
      <circle cx="22" cy="18" r="4" class="sage-light" />
      <circle cx="44" cy="18" r="6" class="amber" />
      <circle cx="66" cy="18" r="4" class="sage-light" />
      <circle cx="88" cy="18" r="4" class="sage-light" />

      <circle cx="0" cy="36" r="4" class="sage-light" />
      <circle cx="22" cy="36" r="4" class="sage-light" />
      <circle cx="44" cy="36" r="4" class="sage-light" />
      <circle cx="66" cy="36" r="4" class="sage-light" />
      <circle cx="88" cy="36" r="4" class="sage-light" />
    </g>
  </g>

  <!-- Friendly Bell Icon Floating in Front -->
  <g transform="translate(230, 140)">
    <!-- Bell Aura -->
    <circle cx="25" cy="25" r="36" class="amber-light" />
    
    <!-- Bell Body -->
    <path d="M25,2 C15,2 10,12 8,28 L4,34 C3,36 4,38 7,38 L43,38 C46,38 47,36 46,34 L42,28 C40,12 35,2 25,2 Z" class="amber" />
    <circle cx="25" cy="2" r="3.5" class="brown" />
    <!-- Bell Clapper -->
    <circle cx="25" cy="42" r="4.5" class="terracotta" />
    <!-- Bell Face / Smile -->
    <circle cx="20" cy="22" r="1.5" class="brown" />
    <circle cx="30" cy="22" r="1.5" class="brown" />
    <path d="M22,26 Q25,29 28,26" stroke="#4A372E" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Organic Botanical Leaf sprig -->
  <g transform="translate(100, 160)">
    <path d="M10,40 Q25,10 45,-5" stroke="#8DA06F" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M25,25 Q12,18 20,10 Q32,15 25,25 Z" class="sage-dark" />
    <path d="M35,10 Q45,2 40,-8 Q30,0 35,10 Z" class="sage-dark" />
  </g>

  <!-- Sparkles -->
  <path d="M110,85 L112,90 L117,92 L112,94 L110,99 L108,94 L103,92 L108,90 Z" class="lavender" />
  <path d="M295,90 L297,95 L302,97 L297,99 L295,104 L293,99 L288,97 L293,95 Z" class="amber" />
</svg>
